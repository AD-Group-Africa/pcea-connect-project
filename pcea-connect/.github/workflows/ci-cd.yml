name: PCEA Connect CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build backend
        run: ./gradlew build -x test
      - name: Build Docker images
        run: |
          docker build -t pcea-backend .
          cd frontend && docker build -t pcea-frontend .
