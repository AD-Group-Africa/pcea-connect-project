spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pcea
    driver-class-name: org.postgresql.Driver
    username: pcea
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:your_consumer_key}
  consumer-secret: ${MPESA_CONSUMER_SECRET:your_consumer_secret}
  passkey: ${MPESA_PASSKEY:your_passkey}
  shortcode: ${MPESA_SHORTCODE:174379}
  callback-url: ${MPESA_CALLBACK_URL:https://yourdomain.com/api/giving/mpesa-callback}
