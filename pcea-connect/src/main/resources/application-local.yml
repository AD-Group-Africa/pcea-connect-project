# src/main/resources/application-local.yml

jwt:
  secret: "this-is-a-very-long-secret-key-for-demo-only-256-bits-minimum-1234567890"

spring:
  datasource:
    url: jdbc:h2:mem:pceaconnect
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update