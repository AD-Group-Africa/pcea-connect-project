spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pcea
    driver-class-name: org.postgresql.Driver
    username: pcea
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # Flyway owns the schema. Legacy databases created by Hibernate (no schema history) are
  # baselined at V043 and only receive V044+; fresh databases receive the full V015+ chain.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 43
    # Shared migrations run everywhere; db/migration-postgresql sits OUTSIDE the
    # base location because Flyway scans recursively — Postgres-only SQL (PL/pgSQL)
    # that H2-based profiles must never execute lives there.
    locations: classpath:db/migration,classpath:db/migration-postgresql

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:your_consumer_key}
  consumer-secret: ${MPESA_CONSUMER_SECRET:your_consumer_secret}
  passkey: ${MPESA_PASSKEY:your_passkey}
  shortcode: ${MPESA_SHORTCODE:174379}
  callback-secret: ${MPESA_CALLBACK_SECRET:CHANGE_ME_dev_only_9f3a7c}
  callback-url: ${MPESA_CALLBACK_URL:https://yourdomain.com/api/giving/mpesa-callback/CHANGE_ME_dev_only_9f3a7c}
africastalking:
  api-key: ${AT_API_KEY:sandbox}
  username: ${AT_USERNAME:sandbox}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}

smtp:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # Secure platform bootstrap: the ONLY email that receives SUPER_ADMIN on registration.
  # When unset, no registration ever inherits SUPER_ADMIN (the first account is a plain
  # MEMBER and an existing admin must grant roles). Leave unset in production until the
  # designated administrator is ready to register, then remove it again.
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  # Membership credential signing: dedicated secret (falls back to jwt.secret when empty).
  credential-secret: ${APP_CREDENTIAL_SECRET:}
  credential-max-age-days: ${APP_CREDENTIAL_MAX_AGE_DAYS:1095}
  cors:
    # Extra allowed CORS origins (comma-separated), e.g. https://pcea-connect.com
    # when the API is consumed cross-origin. Same-origin deployments leave unset.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
