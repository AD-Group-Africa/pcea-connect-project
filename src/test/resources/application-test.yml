security:
  rate-limit:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:pceatest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    # H2 cannot parse Postgres-only SQL (e.g. the PL/pgSQL in
    # V050__fix_livestream_status_ordinal_drift.sql). Flyway scans locations
    # RECURSIVELY, so vendor migrations live in db/migration-postgresql — a
    # sibling that the base classpath:db/migration scan can never reach — and
    # only Postgres profiles (application.yml, application-postgres-test.yml)
    # add that location explicitly.
    locations: classpath:db/migration
  main:
    allow-bean-definition-overriding: true

jwt:
  secret: test-secret-key-that-is-definitely-256-bits-long-1234
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

mpesa:
  consumer-key: test
  consumer-secret: test
  passkey: test
  shortcode: 174379
  callback-secret: unit-test-callback-secret
  callback-url: http://localhost:8080/api/giving/mpesa-callback/unit-test-callback-secret

africastalking:
